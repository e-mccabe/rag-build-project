[project]
name = "rag-build"
version = "0.1.0"
description = "A retrieval-augmented QA pipeline over a markdown knowledge base, with a measured evaluation harness"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.120.2",
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "pandas>=3.0.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-frontmatter>=1.3.0",
    "streamlit>=1.58.0",
    "tiktoken>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_build"]
